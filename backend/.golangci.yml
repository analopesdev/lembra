# GERADO por scripts/gen-golangci.sh. Não edite à mão.
version: "2"
run:
  build-tags: [integration]
linters:
  default: none
  enable: [depguard, forbidigo, errcheck, gosec, govet, staticcheck, unused, ineffassign]
  settings:
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: "Use kernel.Clock; time.Now só em kernel/platform/cmd."
        - pattern: '^time\.Sleep$'
          msg: "Sem sleep: use FakeClock."
    depguard:
      rules:
        auth-domain:
          list-mode: strict
          files: ["**/internal/modules/auth/domain/**", "!$test"]
          allow: [$gostd, github.com/anamorais/lembra/backend/internal/kernel]
        auth-domain-io:
          files: ["**/internal/modules/auth/domain/**", "!$test"]
          deny:
            - {pkg: net, desc: "sem I/O no domain"}
            - {pkg: os, desc: "sem I/O no domain"}
            - {pkg: io/ioutil, desc: "sem I/O no domain"}
            - {pkg: database/sql, desc: "sem SQL no domain"}
            - {pkg: log, desc: "sem logging no domain"}
            - {pkg: log/slog, desc: "sem logging no domain"}
            - {pkg: math/rand, desc: "aleatoriedade deve ser injetada"}
            - {pkg: crypto/rand, desc: "aleatoriedade deve ser injetada"}
        auth-app:
          files: ["**/internal/modules/auth/app/**"]
          deny:
            - pkg: github.com/anamorais/lembra/backend/internal/modules/auth/adapters
              desc: app não importa adapters (adapters → app → domain)
            - pkg: net/http
              desc: sem HTTP em app
            - pkg: database/sql
              desc: sem SQL em app
            - pkg: github.com/jackc/pgx
              desc: sem SQL em app
            - pkg: github.com/anamorais/lembra/backend/internal/modules/collections/domain
              desc: módulos só se falam pelo app.Service público
            - pkg: github.com/anamorais/lembra/backend/internal/modules/collections/adapters
              desc: módulos só se falam pelo app.Service público
