packages:
  - "apps/*"
# Metro/Expo precisam de node_modules plano.
nodeLinker: hoisted
# Scripts de build negados de propósito (pnpm 12 falha se houver script pendente de aprovação):
# esbuild traz o binário por dependência opcional e @parcel/watcher é opcional.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
