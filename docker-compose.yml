services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lembra
      POSTGRES_PASSWORD: lembra
      POSTGRES_DB: lembra
    ports: ["${LEMBRA_PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lembra -d lembra"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profile `storage`: a imagem oficial do MinIO saiu do Docker Hub e do quay.io (401).
  # Pendente de decisão do usuário (ADR-0016). Só é necessário a partir da Etapa 4.
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lembra
      MINIO_ROOT_PASSWORD: lembra-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
