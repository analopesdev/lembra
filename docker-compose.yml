services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lembra
      POSTGRES_PASSWORD: lembra
      POSTGRES_DB: lembra
    ports: ["${LEMBRA_PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lembra -d lembra"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:37919418497f2f8ac6ef5c18760fcd01d1c8f2d17d36723fae0cb2fae67d8093
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lembra
      MINIO_ROOT_PASSWORD: lembra-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MC_HOST_local: http://lembra:lembra-secret@127.0.0.1:9000
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:37919418497f2f8ac6ef5c18760fcd01d1c8f2d17d36723fae0cb2fae67d8093
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://lembra:lembra-secret@minio:9000
    entrypoint: ["mc", "mb", "-p", "local/lembra"]

volumes:
  pgdata:
  miniodata:
